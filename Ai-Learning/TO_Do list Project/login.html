<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Sign In</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-card">
    <!-- Header with Theme Toggle -->
    <div class="auth-header">
      <div class="logo-group">
        <div class="logo-icon">✓</div>
        <div>
          <h1>TaskFlow</h1>
          <p class="subtitle">Your personal productivity space</p>
        </div>
      </div>
      <button id="themeToggle" class="icon-btn" title="Toggle Dark/Light Mode" aria-label="Toggle theme">
        <span id="themeIcon">🌙</span>
      </button>
    </div>

    <div class="auth-welcome">
      <h2>Welcome Back</h2>
      <p>Log in to access your saved tasks, or continue as a guest.</p>
    </div>

    <!-- Error Alert Box -->
    <div id="errorAlert" class="auth-alert hidden">
      <span class="alert-icon">⚠️</span>
      <span id="errorMessage">Invalid username or password</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="username" 
            placeholder="e.g. @tul" 
            required 
            autocomplete="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="password" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
          />
          <button type="button" id="togglePassword" class="toggle-password-btn" title="Show/Hide Password" aria-label="Toggle password visibility">
            👁️
          </button>
        </div>
      </div>

      <!-- Quick Demo Credentials Hint -->
      <div class="credentials-hint">
        <span class="hint-title">💡 Default Credentials:</span>
        <div class="hint-row">
          <span>Username: <code>@tul</code></span>
          <span>Password: <code>Atul</code></span>
        </div>
        <button type="button" id="autoFillBtn" class="auto-fill-btn">⚡ Auto-fill for me</button>
      </div>

      <button type="submit" class="primary-btn auth-submit-btn">
        <span>Log In</span>
      </button>
    </form>

    <div class="auth-divider">
      <span>OR</span>
    </div>

    <!-- Optional / Guest Access Button -->
    <button id="guestBtn" class="guest-btn" type="button">
      <span>Continue as Guest (Skip Login) →</span>
    </button>
  </div>

  <script src="auth.js"></script>
</body>
</html>
