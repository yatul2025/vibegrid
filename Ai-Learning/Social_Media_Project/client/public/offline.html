<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <title>Offline — VibeGrid</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background: #090d16;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
      }
      .offline-card {
        max-width: 440px;
        width: 100%;
        background: #131b2e;
        border: 1px solid #243048;
        border-radius: 24px;
        padding: 44px 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .offline-logo {
        margin-bottom: 24px;
      }
      .offline-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(245, 158, 11, 0.15);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.3);
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 16px;
      }
      .offline-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.4px;
        margin-bottom: 10px;
        color: #ffffff;
      }
      .offline-desc {
        font-size: 15px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .offline-btn {
        background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
        color: #ffffff;
        border: none;
        border-radius: 9999px;
        padding: 13px 32px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      }
      .offline-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.55);
      }
      .offline-btn:active {
        transform: translateY(0);
      }
      .offline-hint {
        margin-top: 22px;
        font-size: 12px;
        color: #64748b;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f8fafc;
          color: #0f172a;
        }
        .offline-card {
          background: #ffffff;
          border-color: #e2e8f0;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }
        .offline-title {
          color: #0f172a;
        }
        .offline-desc {
          color: #64748b;
        }
        .offline-hint {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="offline-logo">
        <svg viewBox="0 0 52 52" width="56" height="56" fill="none">
          <defs>
            <linearGradient id="vgGradOff" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f09433" />
              <stop offset="25%" stop-color="#e6683c" />
              <stop offset="50%" stop-color="#dc2743" />
              <stop offset="75%" stop-color="#cc2366" />
              <stop offset="100%" stop-color="#bc1888" />
            </linearGradient>
          </defs>
          <rect width="52" height="52" rx="16" fill="url(#vgGradOff)" />
          <path
            d="M14 15 L26 38 L38 15"
            stroke="#ffffff"
            stroke-width="5.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <div class="offline-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        <span>NO INTERNET CONNECTION</span>
      </div>

      <h1 class="offline-title">You're Offline</h1>
      <p class="offline-desc">
        VibeGrid needs an active internet connection to load new posts and send messages. Please check your Wi-Fi or cellular network.
      </p>

      <button class="offline-btn" onclick="retryConnection()">
        Try Reconnecting
      </button>

      <p class="offline-hint">
        When your connection returns, VibeGrid will sync automatically.
      </p>
    </div>

    <script>
      function retryConnection() {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          const btn = document.querySelector('.offline-btn');
          const orig = btn.innerText;
          btn.innerText = 'Still Offline...';
          setTimeout(() => { btn.innerText = orig; }, 1500);
        }
      }

      window.addEventListener('online', () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
