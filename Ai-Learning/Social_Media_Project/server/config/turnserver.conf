# ==============================================================================
# VibeGrid coturn TURN Server Configuration (turnserver.conf)
# ==============================================================================
# Production NAT Traversal & Relay Configuration for WebRTC Audio/Video Calls
# 
# Security & Auth:
# Uses time-limited ephemeral credentials via HMAC-SHA1 shared secret.
# Credentials are generated dynamically by /api/calls/turn-credentials.
# ==============================================================================

# Listening Ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350

# Listening IP addresses (0.0.0.0 binds to all available interfaces)
listening-ip=0.0.0.0

# External / Public IP (Replace with your public cloud IP in production)
# external-ip=YOUR_PUBLIC_IP

# Realm (Domain name for WebRTC clients)
realm=vibegrid.app

# Ephemeral Shared Secret Authentication (Time-Limited TURN REST API)
# Must match the `TURN_SECRET` in your server environment variables
use-auth-secret
static-auth-secret=vibegrid_e2ee_turn_shared_secret_super_secure_key_2026

# SSL / TLS Certificate paths (Let's Encrypt or Cloudflare TLS)
# cert=/etc/letsencrypt/live/turn.vibegrid.app/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.vibegrid.app/privkey.pem

# Relay Port Range (UDP/TCP ports opened on firewall for media relay)
min-port=49152
max-port=65535

# Fingerprinting in TURN messages (Recommended for WebRTC)
fingerprint

# Performance & Rate Limiting
bps-capacity=0
stale-nonce=600
max-allocate-per-user=10
total-quota=100

# Logging
verbose
no-stdout-log
log-file=/var/log/turnserver.log

# Security Hardening: Block loopback and private IPv4 networks from relay
no-loopback-peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
